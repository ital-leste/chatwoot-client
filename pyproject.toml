[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ital-leste-chatwoot-client"
version = "0.1.0"
description = "Cliente Python reutilizavel para a Application API do Chatwoot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chatwoot_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
